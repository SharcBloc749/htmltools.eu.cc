<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Coin Catcher</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 5px 0;
            color: #00ffd2;
            text-shadow: 0 0 10px rgba(0,255,210,0.5);
        }

        #scoreboard {
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #scoreValue { color: #ffd700; }
        #timerValue { color: #ff4757; }

        #gameCanvas {
            background: #162447;
            border: 4px solid #0f3460;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            border-radius: 8px;
        }

        #controls {
            margin-top: 15px;
            color: #8c92ac;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Overlay screens styling */
        #screen-overlay {
            position: absolute;
            background: rgba(22, 36, 71, 0.95);
            border: 4px solid #00ffd2;
            border-radius: 8px;
            width: 400px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 210, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            background: #00ffd2;
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background: #00c8a5;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>COIN CATCHER</h1>
    
    <div id="scoreboard">
        <div>SCORE: <span id="scoreValue">0</span></div>
        <div>TIME LEFT: <span id="timerValue">30</span>s</div>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div id="controls">Use <b>LEFT / RIGHT Arrow Keys</b> or <b>A / D</b> to move the bucket</div>

    <!-- Start / Game Over Overlay Screen -->
    <div id="screen-overlay">
        <h2 id="overlay-title">Ready to Catch?</h2>
        <p id="overlay-desc">Catch as many golden coins as you can before the time runs out! Avoid letting them hit the ground.</p>
        <button id="actionBtn" onclick="startGame()">START GAME</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreValue = document.getElementById('scoreValue');
        const timerValue = document.getElementById('timerValue');
        const overlay = document.getElementById('screen-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const actionBtn = document.getElementById('actionBtn');

        // Game state variables
        let score = 0;
        let timeLeft = 30;
        let isPlaying = false;
        let gameInterval;
        let timerInterval;

        // Player Bucket metrics
        const bucket = {
            x: canvas.width / 2 - 40,
            y: canvas.height - 30,
            width: 80,
            height: 20,
            speed: 8,
            color: #00ffd2'
        };

        // Coins array
        let coins = [];

        // Track keyboard inputs
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            a: false,
            d: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.key in keys) keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key in keys) keys[e.key] = false;
        });

        // Initialize / Reset function
        function startGame() {
            overlay.style.display = 'none';
            score = 0;
            timeLeft = 30;
            coins = [];
            bucket.x = canvas.width / 2 - (bucket.width / 2);
            isPlaying = true;
            
            scoreValue.textContent = score;
            timerValue.textContent = timeLeft;

            // Clear previous loops if any exist safely
            clearInterval(gameInterval);
            clearInterval(timerInterval);

            // Trigger game updates and countdowns
            gameInterval = setInterval(updateGame, 1000 / 60); // 60 FPS
            timerInterval = setInterval(updateTimer, 1000);
        }

        // Spawn a coin at random top intervals
        function spawnCoin() {
            if (Math.random() < 0.03) { // Frequency filter
                coins.push({
                    x: Math.random() * (canvas.width - 20) + 10,
                    y: 0,
                    radius: 10,
                    speed: Math.random() * 3 + 2, // Varied fall rates
                    color: '#ffd700'
                });
            }
        }

        // Main game mechanics loop
        function updateGame() {
            if (!isPlaying) return;

            // 1. Move Player Bucket
            if (keys.ArrowLeft || keys.a) {
                bucket.x -= bucket.speed;
                if (bucket.x < 0) bucket.x = 0;
            }
            if (keys.ArrowRight || keys.d) {
                bucket.x += bucket.speed;
                if (bucket.x + bucket.width > canvas.width) bucket.x = canvas.width - bucket.width;
            }

            // 2. Manage Coins
            spawnCoin();
            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                coin.y += coin.speed;

                // Collision detection with the bucket
                if (
                    coin.y + coin.radius >= bucket.y &&
                    coin.x >= bucket.x &&
                    coin.x <= bucket.x + bucket.width
                ) {
                    score += 10;
                    scoreValue.textContent = score;
                    coins.splice(i, 1);
                    continue;
                }

                // Remove missed coins out of bounds
                if (coin.y - coin.radius > canvas.height) {
                    coins.splice(i, 1);
                }
            }

            // 3. Render Graphics
            render();
        }

        // Clear and redraw canvas canvas elements
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Bucket
            ctx.fillStyle = bucket.color;
            ctx.fillRect(bucket.x, bucket.y, bucket.width, bucket.height);
            ctx.shadowBlur = 10;
            ctx.shadowColor = bucket.color;

            // Draw Coins
            ctx.shadowBlur = 15;
            for (let coin of coins) {
                ctx.fillStyle = coin.color;
                ctx.shadowColor = coin.color;
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0; // Reset shadow blur mechanics
        }

        // Countdown Timer Logic
        function updateTimer() {
            timeLeft--;
            timerValue.textContent = timeLeft;

            if (timeLeft <= 0) {
                endGame();
            }
        }

        // End Game UI Swap
        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(timerInterval);

            overlayTitle.textContent = "Time's Up!";
            overlayDesc.innerHTML = `Great job! You collected a final score of <b>${score} points</b>.`;
            actionBtn.textContent = "PLAY AGAIN";
            overlay.style.display = 'flex';
        }
    </script>
</body>
</html>
