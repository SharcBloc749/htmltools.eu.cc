<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat · AI Lab</title><style>:root{--bg:#171819;--panel:#222427;--panel2:#1d1f21;--line:#36383d;--text:#f4f4f0;--muted:#9b9da3;--accent:#ededeb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,select,textarea{font:inherit}button,select{color:var(--text);background:#292b2f;border:1px solid var(--line);border-radius:9px;padding:9px 11px}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:270px 1fr}.side{border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:18px;background:#1b1c1e}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:30px;height:30px;border-radius:8px;background:white}.new{width:100%;background:var(--accent);color:#111;font-weight:800}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.model-list{display:flex;flex-direction:column;gap:6px;overflow:auto}.model-list button{text-align:left;background:transparent;border-color:transparent;color:#c6c7ca;padding:10px}.model-list button.active{background:#303237;color:white;border-color:var(--line)}.model-list small{display:block;color:#85878c;margin-top:3px}.main{display:flex;flex-direction:column;min-width:0}.top{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top h2{font-size:15px;margin:0}.top span{color:var(--muted);font-size:12px}.messages{flex:1;overflow:auto;padding:32px max(18px,calc((100% - 840px)/2));}.welcome{max-width:650px;margin:10vh auto;text-align:center}.welcome h1{font-size:38px;margin:8px}.welcome p{color:var(--muted);line-height:1.6}.msg{display:flex;gap:13px;margin:24px 0;line-height:1.65}.avatar{width:29px;height:29px;flex:none;border-radius:9px;display:grid;place-items:center;background:#35373c;font-size:12px;font-weight:800}.msg.user .avatar{background:#eee;color:#111}.bubble{max-width:760px;white-space:pre-wrap;overflow-wrap:anywhere}.meta{color:#85878c;font-size:11px;margin-bottom:4px}.composer{padding:14px max(18px,calc((100% - 840px)/2));border-top:1px solid var(--line);background:#1b1c1e}.tools{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.tools label{border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:#ccc;cursor:pointer}.tools input{display:none}.box{display:flex;gap:9px;background:#25272b;border:1px solid var(--line);border-radius:14px;padding:10px}.box textarea{flex:1;resize:none;min-height:48px;max-height:160px;background:transparent;border:0;outline:0;color:white;padding:8px}.send{background:#eee;color:#111;font-weight:800;align-self:flex-end}.preview{display:none;align-items:center;gap:8px;color:#bbb;margin:8px 0}.preview img{height:48px;width:48px;object-fit:cover;border-radius:7px}.thinking{color:#aeb0b4;font-style:italic}.research{color:#c9c9b0;border-left:2px solid #aaa;padding-left:10px;margin:8px 0}.gen{max-width:100%;border-radius:12px;margin-top:8px}@media(max-width:780px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 15px}}</style></head><body><div class="app"><aside class="side"><a class="brand" href="/"><img src="https://htmltools.me/logo3.png">AI Lab</a><button class="new" onclick="newChat()">＋ New conversation</button><div class="label">Models · best first</div><div id="models" class="model-list"></div><div style="margin-top:auto;color:#777;font-size:11px">Room ID: <span id="room"></span></div></aside><main class="main"><header class="top"><h2 id="title">New conversation</h2><div><span id="status">Ready</span> · <button onclick="copyLink()">Copy link</button></div></header><section id="messages" class="messages"><div class="welcome"><div class="eyebrow">Private room</div><h1>What are we building?</h1><p>Choose a model, attach an image, or enable Research mode. Your conversation is saved locally under its unique room ID.</p></div></section><section class="composer"><div class="tools"><select id="model"></select><label><input id="research" type="checkbox"> ✦ Research mode</label><label><input id="thinking" type="checkbox" checked> Show reasoning</label><label for="file">＋ Attach image</label><input id="file" type="file" accept="image/*"></div><div id="preview" class="preview"><img id="thumb"><span id="filename"></span><button onclick="clearFile()">×</button></div><div class="box"><textarea id="input" placeholder="Message the selected model…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button class="send" onclick="send()">Send ↑</button></div></section></main></div><script>const API='https://ai-lab.owner-bc8.workers.dev';const path=location.pathname.split('/');let id=path[2]&&path[2]!=='new'?path[2]:crypto.randomUUID().slice(0,8);if(path[2]==='new')history.replaceState({},'',`/Chat/${id}`);let historyData=JSON.parse(localStorage.getItem('chat-'+id)||'[]');let chosen='groq:llama-3.3-70b-versatile',fileData=null;const fallback=[['groq:llama-3.3-70b-versatile','Best · Groq Llama 3.3 70B'],['groq:openai/gpt-oss-120b','Best · Groq GPT-OSS 120B'],['mistral:mistral-large-latest','Best · Mistral Large'],['mistral:mistral-small-latest','Fast · Mistral Small'],['openrouter:nvidia/nemotron-3-ultra-550b-a55b:free','Best free · Nemotron Ultra'],['openrouter:qwen/qwen3.8-27b:free','Vision/free · Qwen'],['openrouter:openai/gpt-oss-120b:free','Reasoning/free · GPT-OSS'],['openrouter:meta-llama/llama-3.3-70b-instruct:free','Reliable/free · Llama'],['pollinations:flux','Image · Pollinations'],['horde:stable_diffusion_xl','Image · AI Horde']];document.getElementById('room').textContent=id;function esc(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function renderModels(a=fallback){let sel=document.getElementById('model'),list=document.getElementById('models');sel.innerHTML='';list.innerHTML='';a.forEach(([v,n],i)=>{let o=new Option(n,v);sel.add(o);let b=document.createElement('button');b.innerHTML=n.replace(' · ','<small>')+(n.includes(' · ')?'</small>':'');b.onclick=()=>{sel.value=v;chosen=v;document.querySelectorAll('.model-list button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};list.append(b)});sel.value=chosen}async function load(){try{let r=await fetch(API+'/api/models');let j=await r.json();if(j.models?.length)renderModels(j.models.map(x=>[x.id,x.label]))}catch(e){renderModels()};historyData.forEach(x=>addMsg(x.role,x.text,x.extra||''))}function addMsg(role,text,extra=''){let w=document.querySelector('.welcome');if(w)w.remove();let el=document.createElement('div');el.className='msg '+role;el.innerHTML=`<div class="avatar">${role==='user'?'You':'AI'}</div><div class="bubble"><div class="meta">${role==='user'?'You':chosen}</div><div>${esc(text)}</div>${extra}</div>`;document.getElementById('messages').append(el);el.scrollIntoView({behavior:'smooth',block:'end'})}function clearFile(){fileData=null;document.getElementById('preview').style.display='none';document.getElementById('file').value=''}document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{fileData={name:f.name,data:r.result};thumb.src=r.result;filename.textContent=f.name;preview.style.display='flex'};r.readAsDataURL(f)};async function send(){let inp=document.getElementById('input'),text=inp.value.trim();if(!text&&!fileData)return;inp.value='';let shown=text||'Describe this image';addMsg('user',shown,fileData?`<img class="gen" src="${fileData.data}">`:'' );historyData.push({role:'user',text:shown});localStorage.setItem('chat-'+id,JSON.stringify(historyData));status.textContent='Thinking…';let loadEl=document.createElement('div');loadEl.className='msg assistant thinking';loadEl.innerHTML='<div class="avatar">AI</div><div>Thinking…</div>';messages.append(loadEl);try{let r=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chatId:id,model:document.getElementById('model').value,message:text,history:historyData.slice(-14),image:fileData?.data||null,research:research.checked,showThinking:thinking.checked})});let j=await r.json();loadEl.remove();if(j.image){addMsg('assistant','Generated image',`<img class="gen" src="${j.image}">`);historyData.push({role:'assistant',text:'[Generated image]'})}else{addMsg('assistant',j.answer||j.error||'No response',j.sources?`<div class="research">Sources: ${j.sources.map(x=>esc(x.title||x.url)).join(' · ')}</div>`:'');historyData.push({role:'assistant',text:j.answer||j.error||''})}localStorage.setItem('chat-'+id,JSON.stringify(historyData))}catch(e){loadEl.remove();addMsg('assistant','Connection error: '+e.message)}status.textContent='Ready';clearFile()}function newChat(){location.href='/Chat/'+crypto.randomUUID().slice(0,8)}function copyLink(){navigator.clipboard?.writeText(location.href);status.textContent='Link copied';setTimeout(()=>status.textContent='Ready',1200)}load();</script><script>(function(){function c(){var b=a.contentDocument||(a.contentWindow&&a.contentWindow.document);if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'a45fdff7a9197c7c',t:'MTc5MTIzOTQ2OA=='};var a=document.createElement('script');a.src='/cdn-cgi/challenge-platform/scripts/jsd/main.js';document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechang
